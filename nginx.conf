server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any unmatched path (a client-side react-router route)
    # serves index.html instead of nginx's own 404, so the router can take
    # over from there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
