name: Frontend CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: npm ci

      - name: Lint
        run: npm run lint

      # VITE_* values are baked into the JS bundle at build time, not read at
      # container runtime — must be set here, before `vite build` runs.
      - name: Build
        env:
          VITE_API_BASE_URL: https://api.ecofood.dpdns.org
          VITE_KEYCLOAK_BASE_URL: https://idp.ecofood.dpdns.org
          VITE_USE_MOCK_API: "false"
        run: npm run build

      - name: Build Docker image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: frontend:pr-${{ github.event.pull_request.number }}

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: frontend:pr-${{ github.event.pull_request.number }}
          severity: CRITICAL
          exit-code: '1'
